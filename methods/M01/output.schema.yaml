# M01 输出schema（每轮prompt必须自携本文件相关部分，禁悬空引用〔S17〕）
method: M01
version: v0.1

output:
  run:
    run_id: {type: string, required: true}
    skill_version: {type: string, required: true}
    downgrade_flags: {type: array, items: {enum: [SHARE_MISSING, CALIBER_MIXED, GRANULARITY_LOW, B_MISSING, C_TIMELINE_PARTIAL, C4_NO_SALES_DATA]}, note: 只允许枚举值，禁自拟〔S4〕}

  market_def:
    category: {type: string, required: true, note: 品类}
    price_band: {type: string, required: true, note: 价格带区间}
    time_window: {type: string, required: true}
    caliber: {type: string, required: true, note: 口径声明}

  intermediate_tables:
    share:
      fields:
        player: {type: string}
        period: {type: string}
        volume: {type: number, required: false}
        share: {type: string, note: 点值或分档近似}
        caliber: {type: string}
        source: {type: url}
        confidence: {enum: [官方, 第三方, 估算]}
    concentration:
      fields:
        window: {type: string, note: 上市前基期/上市后〔C3/C4分窗口〕}
        CR3: {type: string, required: false}
        CR4: {type: string, required: false}
        HHI: {type: string, note: 分档近似时按区间输出，禁单值〔GRANULARITY_LOW〕}
        HHI_band: {enum: [分散, 中度, 高集中, 不可判], note: DOJ口径分档}
    bands:
      fields:
        band: {type: string, note: 价格带}
        players: {type: array, items: {type: string}}
        price_range: {type: string}
        density: {type: string, note: 带内竞争密度}
        own_position: {type: string, required: false, note: 本品落位分位}

  diagnostic_items:
    type: array
    min: 2
    max: 4
    item_fields:
      L1_fact: {type: string, required: true}
      L2_mechanism: {type: string, required: true, note: 只许援引SCP/HHI/垄断竞争三支柱}
      L3_quantification: {type: string, required: true, note: 缺数据标"未量化+原因"}
      L4_prescription: {type: string, required: true}
      confounder_check: {type: string, required: true, note: C1-C4逐条；必含边界敏感性声明〔C2〕}
      evidence_strength: {enum: [官方, 第三方, 估算], required: true}
      chart_refs: {type: array, items: {type: string}}

  conflict_resolutions:
    type: array
    item_fields:
      checkpoint: {type: string}
      conflict: {type: string}
      resolution: {type: string}
      verdict: {type: string}
      assumptions: {type: array, note: 反推类必附〔S11〕}

  data_gap_reports:
    type: array
    item_fields:
      missing: {type: string}
      granularity: {type: string}
      confidence_required: {type: string}
      consumed_by: {type: string}

  method_xref:
    type: array
    item_fields:
      target_method: {type: string, note: 过注册表编号校验；典型：M04（价差→锚定）/M05（结构→弹性）}
      hint: {type: string}
      data_needed: {type: string}

  limitations_statement: {type: string, required: true}
