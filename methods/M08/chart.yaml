# M08 图表绑定（模板定义见 _shared/chart_templates.yaml）
method: M08

bindings:
  - source_table: [market_break, own_break]
    template: T-LINE-03
    variant_rule: |
      断点前后序列 → V1 单带+断点标注（复用现有模板）；
