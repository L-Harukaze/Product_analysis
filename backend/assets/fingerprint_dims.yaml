# 指纹维度定义（仲裁 S1 槽位数据源 + FingerprintItem.label，ARCHITECTURE 7.1 / 5.4）
# label 与前端展示层对齐（frontend/src/mocks/fixtures.ts）
F1:
  label: 价格 × 频率
  tiers: 低频低价/低频中价/低频高价/中频低价/中频中价/中频高价/高频低价/高频中价/高频高价
  doc: 价格档位由产品价格落品类价格分布分位决定（L2 查表）；频率档位由品类更换周期边界决定。输出格式固定为「{频档}{价档}」，如"中频中价"。
F2:
  label: 信息属性
  tiers: 搜索品/体验品/信任品
  doc: 品类级先验属性——购买前可充分评估=搜索品，需使用后验证=体验品，使用后也难验证=信任品。
F3:
  label: 差异化
  tiers: 强/中/弱
  doc: 品类内差异化光谱上的位置——产品与同档竞品的可感知差异程度（性能/设计/品牌叙事）。
F4:
  label: 生态
  tiers: 强/中/无
  doc: 产品对生态体系的绑定程度——互联设备、账号体系、迁移成本。
F5:
  label: 政策敏感
  tiers: 低/中/高
  doc: 价格与需求受补贴/关税/准入等政策影响的程度。
F6:
  label: 供给形态
  tiers: 实体/虚拟/服务
  doc: 产品供给形态的事实判断。
